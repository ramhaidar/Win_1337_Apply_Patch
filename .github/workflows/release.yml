name: Manual tagged draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build and tag. Must include a leading 'v'; examples: v2.0, v2.1, v2.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      commit_time: ${{ steps.source.outputs.commit_time }}
    steps:
      - name: Resolve version and dispatched source commit
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        with:
          retries: 0
          script: |
            // BEGIN resolve-version
            const version = process.env.RELEASE_VERSION;
            if (!/^v[0-9][A-Za-z0-9._-]{0,62}$/.test(version ?? '') || version.includes('..') || version.endsWith('.') || /\.lock$/i.test(version)) {
              throw new Error("Version must include a leading 'v'; examples: v2.0, v2.1, v2.2.");
            }
            const repository = 'ramhaidar/Win_1337_Apply_Patch';
            if (process.env.GITHUB_REPOSITORY !== repository || `${context.repo.owner}/${context.repo.repo}` !== repository) throw new Error('Release tagging is restricted to the maintainer repository.');
            const info = (await github.rest.repos.get({ ...context.repo })).data;
            if (context.ref !== `refs/heads/${info.default_branch}`) throw new Error('Dispatch this workflow from the default branch only.');
            const sha = context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('Dispatch commit is not a full commit SHA.');
            async function tagExists() {
              try {
                return (await github.rest.git.getRef({ ...context.repo, ref: `tags/${version}` })).data.ref === `refs/tags/${version}`;
              }
              catch (error) {
                if (error.status !== 404) throw error;
                return false;
              }
            }
            async function assertNoRelease() {
              for (let page = 1; ; page++) {
                const releases = (await github.rest.repos.listReleases({ ...context.repo, per_page: 100, page })).data;
                if (releases.some(release => release.tag_name === version)) throw new Error('A release or draft already uses this version.');
                if (releases.length < 100) break;
                if (page >= 1000) throw new Error('Release listing exceeded safe pagination limit.');
              }
            }
            if (await tagExists()) throw new Error('That tag already exists; choose a new version. This workflow never moves an existing tag.');
            await assertNoRelease();
            const commit = (await github.rest.repos.getCommit({ ...context.repo, ref: sha })).data;
            if (commit.sha !== sha || !Number.isFinite(Date.parse(commit.commit.committer.date))) throw new Error('Invalid commit metadata.');
            core.setOutput('version', version);
            core.setOutput('source_sha', sha);
            core.setOutput('commit_time', commit.commit.committer.date);
            // END resolve-version

  build:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the dispatched source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require release configuration at the dispatch commit
        shell: pwsh
        run: |
          foreach ($file in @('global.json', 'Directory.Build.props', 'scripts/Build-Release.ps1', 'scripts/Verify-Build.ps1', 'scripts/ReleaseArtifacts.psm1', 'Win_1337_Patch/packages.lock.json', 'Win_1337_Patch.Tests/packages.lock.json', 'Win_1337_Patch/packages.win-x64-framework-dependent.lock.json', 'Win_1337_Patch/packages.win-x64-self-contained.lock.json')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Dispatch commit lacks $file. Merge the release pipeline to the default branch first; no fallback source or unlocked restore is allowed." }
          }
      - name: Install pinned SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Verify and build both distributions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          COMMIT_TIME: ${{ needs.resolve.outputs.commit_time }}
        run: |
          pwsh -NoProfile -File scripts/Build-Release.ps1 -Tag $env:RELEASE_VERSION -SourceCommit $env:SOURCE_SHA -CommitTimeUtc $env:COMMIT_TIME -PendingTag -OutputDirectory artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Retain exactly the verified assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release/*
          if-no-files-found: error
          overwrite: false

  draft:
    needs: [resolve, build]
    if: github.repository == 'ramhaidar/Win_1337_Apply_Patch'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download this run's verified assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-${{ needs.resolve.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets
      - name: Create the version tag and draft without rebuilding
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          COMMIT_TIME: ${{ needs.resolve.outputs.commit_time }}
          ARTIFACT_DIRECTORY: release-assets
        with:
          retries: 0
          script: |
            // BEGIN promote-draft
            const fs = require('node:fs');
            const path = require('node:path');
            const crypto = require('node:crypto');
            const version = process.env.RELEASE_VERSION;
            const sha = process.env.SOURCE_SHA;
            const repository = 'ramhaidar/Win_1337_Apply_Patch';
            if (process.env.GITHUB_REPOSITORY !== repository || `${context.repo.owner}/${context.repo.repo}` !== repository) throw new Error('Draft creation is restricted to the maintainer repository.');
            if (!/^v[0-9][A-Za-z0-9._-]{0,62}$/.test(version ?? '') || version.includes('..') || version.endsWith('.') || /\.lock$/i.test(version) || !/^[a-f0-9]{40}$/.test(sha ?? '')) throw new Error('Invalid release identity.');
            const names = ['framework-dependent', 'self-contained'].map(mode => `Win_1337_Patch-${version}-win-x64-${mode}.zip`);
            const assets = [...names, 'SHA256SUMS', 'provenance.json'];
            const directory = path.resolve(process.env.ARTIFACT_DIRECTORY);
            const root = fs.lstatSync(directory);
            if (!root.isDirectory() || root.isSymbolicLink()) throw new Error('Invalid artifact root.');
            const entries = fs.readdirSync(directory);
            if (entries.length !== assets.length || entries.some(name => !assets.includes(name))) throw new Error('Unexpected or missing artifact filenames.');
            const bytes = new Map();
            for (const name of assets) {
              const file = path.join(directory, name);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`Not a regular artifact: ${name}`);
              bytes.set(name, fs.readFileSync(file));
            }
            const hashes = names.map(name => ({ name, sha256: crypto.createHash('sha256').update(bytes.get(name)).digest('hex') }));
            const manifest = hashes.map(asset => `${asset.sha256}  ${asset.name}\n`).join('');
            if (!bytes.get('SHA256SUMS').equals(Buffer.from(manifest, 'utf8'))) throw new Error('SHA256SUMS differs from verified ZIP bytes.');
            const provenance = JSON.parse(bytes.get('provenance.json').toString('utf8'));
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            if (provenance.schemaVersion !== 1 || provenance.repository !== repository || provenance.sourceStatus !== 'pending-tag' || provenance.sourceTag !== version || provenance.sourceCommit !== sha || Date.parse(provenance.commitTimeUtc) !== Date.parse(process.env.COMMIT_TIME) || provenance.workflowRef !== process.env.GITHUB_WORKFLOW_REF || provenance.workflowSha !== process.env.GITHUB_WORKFLOW_SHA || provenance.runUrl !== runUrl || provenance.sdkVersion !== '10.0.401' || provenance.runtimeVersion !== '10.0.12' || provenance.assemblyVersion !== '2.4.0.0') throw new Error('Provenance does not match this source and workflow run.');
            if (JSON.stringify(provenance.publishModes) !== JSON.stringify(['framework-dependent', 'self-contained']) || !Array.isArray(provenance.artifacts) || provenance.artifacts.length !== 2 || hashes.some((asset, i) => provenance.artifacts[i]?.name !== asset.name || provenance.artifacts[i]?.sha256 !== asset.sha256)) throw new Error('Provenance artifact hashes or modes do not match.');
            async function assertVersionIsFree() {
              let exists = false;
              try {
                exists = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${version}` })).data.ref === `refs/tags/${version}`;
              }
              catch (error) {
                if (error.status !== 404) throw error;
              }
              if (exists) throw new Error('Tag already exists; this workflow never moves or overwrites an existing tag.');
              for (let page = 1; ; page++) {
                const releases = (await github.rest.repos.listReleases({ ...context.repo, per_page: 100, page })).data;
                if (releases.some(release => release.tag_name === version)) throw new Error('Release or draft already exists; no assets will be overwritten.');
                if (releases.length < 100) break;
                if (page >= 1000) throw new Error('Release listing exceeded safe pagination limit.');
              }
            }
            async function assertCreatedTag() {
              const ref = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${version}` })).data;
              if (ref.ref !== `refs/tags/${version}`) throw new Error('Different tag reference returned.');
              let object = ref.object;
              const seen = new Set();
              while (object.type === 'tag') {
                if (!/^[a-f0-9]{40}$/.test(object.sha) || seen.has(object.sha) || seen.size >= 16) throw new Error('Invalid annotated tag.');
                seen.add(object.sha);
                object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
              }
              if (object.type !== 'commit' || object.sha !== sha) throw new Error('Created tag does not resolve to the built commit.');
            }
            await assertVersionIsFree();
            const created = (await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${version}`, sha })).data;
            if (created.ref !== `refs/tags/${version}`) throw new Error('Tag creation returned a different reference. Inspect the repository manually.');
            await assertCreatedTag();
            const notes = `Tagged ${version} at commit ${sha} on the default branch by this run; the assets were built from that same commit.\n\nFramework-dependent ZIP requires .NET Desktop Runtime 10.0.12 or a compatible newer patch (x64). Self-contained ZIP bundles runtime 10.0.12. Keep each complete extracted folder.\n\nAssembly version remains 2.4.0.0. Original author: DeltaFoX (DeFconX); GPLv3 LICENSE is included. These binaries are unsigned; SHA-256 is integrity data, not Authenticode or an antivirus guarantee. No artifact attestation is implemented.\n\nWorkflow: ${provenance.workflowRef}\nWorkflow commit: ${provenance.workflowSha}\nBuild run: ${runUrl}\n\nReview all assets and provenance before manually publishing this draft. Hosted provenance does not itself prove byte-identical cross-machine rebuilds.`;
            const release = (await github.rest.repos.createRelease({ ...context.repo, tag_name: version, target_commitish: sha, name: version, body: notes, draft: true, prerelease: false })).data;
            if (!release.draft || release.tag_name !== version) throw new Error('API did not create the expected draft. Inspect it manually.');
            for (const name of assets) {
              const data = bytes.get(name);
              const uploaded = (await github.rest.repos.uploadReleaseAsset({ ...context.repo, release_id: release.id, name, data, headers: { 'content-type': 'application/octet-stream', 'content-length': data.length } })).data;
              if (uploaded.name !== name || uploaded.state !== 'uploaded' || uploaded.size !== data.length) throw new Error(`Incomplete asset upload: ${name}. Inspect the remaining draft manually.`);
            }
            core.info(`Draft created: ${release.html_url}. Nothing has been published.`);
            // END promote-draft
